<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Moved to Competition Stats</title>
    <script>
      // The sum of ranks now lives in Competition Stats. Old links point at
      // #/competitions/<id>; send them to that competition's Sum of ranks tab,
      // and everything else to the search page.
      (function () {
        var target = "https://maxidragon.github.io/competition-stats/";
        var match = location.hash.match(/^#\/competitions\/([^/?#]+)/);
        if (match) target += "#/competition/" + match[1] + "/sor";
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>
      This app moved to
      <a href="https://maxidragon.github.io/competition-stats/">Competition Stats</a>.
    </p>
  </body>
</html>
